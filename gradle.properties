# La Madriguera - Gradle Properties
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official

# ---------------------------------------------------------------------------
# Versión de la app: fuente ÚNICA de verdad para versionCode/versionName.
# scripts/build-apk.sh las lee de aquí para version.json y la página de
# descarga. Se pueden sobreescribir por línea de comandos sin tocar el repo:
#   ./gradlew assembleRelease -PVERSION_CODE=2 -PVERSION_NAME=1.1.0
# Regla de distribución fuera de Play: versionCode SIEMPRE creciente.
# ---------------------------------------------------------------------------
VERSION_CODE=1
VERSION_NAME=1.0.0
